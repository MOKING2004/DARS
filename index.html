<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>پنل دانشجو | ترم ۳</title>
    
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e3c72">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    
    <!-- فونت فارسی وزیر -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- پس‌زمینه انیمیشنی نقطه‌های طلایی -->
    <div id="bg-animation" class="bg-animation"></div>

    <!-- نوتیفیکیشن -->
    <div id="toast" class="toast">متن نوتیفیکیشن</div>

    <!-- نوتیفیکیشن آپدیت -->
    <div id="update-toast" class="toast update-toast">نسخه جدید آماده است</div>

    <!-- صفحه لاگین -->
    <div id="login-overlay" class="login-overlay">
        <div class="login-container glass-card">
            <div class="login-title">🔐 ورود به سامانه</div>
            <form id="login-form">
                <div class="input-group">
                    <label for="username">نام کاربری</label>
                    <input type="text" id="username" placeholder="نام کاربری" autocomplete="off" required>
                </div>
                <div class="input-group">
                    <label for="password">رمز عبور</label>
                    <input type="password" id="password" placeholder="رمز عبور" autocomplete="off" required>
                </div>
                <button type="submit" class="login-btn">ورود</button>
                <p id="login-error" class="error-message"></p>
            </form>
        </div>
    </div>

    <!-- محتوای اصلی -->
    <div id="main-content" class="panel hidden">
        <!-- هدر -->
        <div class="panel-header glass-card">
            <div class="header-right">
                <div class="panel-title">📅 ترم ۳</div>
                <button id="logout-btn" class="logout-btn">خروج</button>
            </div>
            <div class="clock-container">
                <div class="clock" id="clock">--:--:--</div>
                <div class="date" id="date">---</div>
            </div>
        </div>

        <!-- باکس اصلی (کلاس جاری یا امتحان‌های پیش رو) -->
        <div class="glass-card main-info-box" id="main-info-box">
            <div class="box-title" id="box-title">🕒 الان باید در این کلاس باشی:</div>
            <div class="box-content" id="box-content">
                کلاسی در حال برگزاری نیست
            </div>
        </div>

        <!-- تب‌ها -->
        <div class="tabs">
            <div class="tab active" data-tab="weekly">📅 برنامه هفتگی</div>
            <div class="tab" data-tab="list">📋 لیست دروس</div>
            <div class="tab" data-tab="exams">📝 امتحانات</div>
        </div>

        <!-- تب برنامه هفتگی -->
        <div id="weekly-tab" class="tab-content active">
            <div class="table-wrapper glass-card">
                <table id="weekly-schedule-table">
                    <thead>
                        <tr>
                            <th>روز</th>
                            <th>ساعت</th>
                            <th>نام درس</th>
                            <th>استاد</th>
                        </tr>
                    </thead>
                    <tbody id="schedule-body">
                        <!-- ردیف‌ها با جاوااسکریپت ساخته می‌شوند -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- تب لیست دروس -->
        <div id="list-tab" class="tab-content">
            <div class="table-wrapper glass-card">
                <table id="courses-list-table">
                    <thead>
                        <tr>
                            <th data-sort="index">ردیف</th>
                            <th data-sort="name">نام درس</th>
                            <th data-sort="professor">نام استاد</th>
                            <th data-sort="schedule">زمان کلاس</th>
                            <th data-sort="exam">زمان امتحان</th>
                            <th data-sort="units">واحد</th>
                        </tr>
                    </thead>
                    <tbody id="list-body">
                        <!-- ردیف‌ها با جاوااسکریپت ساخته می‌شوند -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- تب امتحانات -->
        <div id="exams-tab" class="tab-content">
            <div class="table-wrapper glass-card">
                <table id="exams-table">
                    <thead>
                        <tr>
                            <th>تاریخ امتحان</th>
                            <th>ساعت امتحان</th>
                            <th>نام درس</th>
                            <th>استاد</th>
                        </tr>
                    </thead>
                    <tbody id="exams-body">
                        <!-- ردیف‌ها با جاوااسکریپت ساخته می‌شوند -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
