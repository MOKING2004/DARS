<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ترم ۳ - برنامه هفتگی</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="panel">
        <!-- هدر با عنوان ترم و ساعت -->
        <div class="panel-header">
            <div class="panel-title">📅 ترم ۳ - برنامه هفتگی</div>
            <div class="clock-container">
                <div class="clock" id="clock">--:--:--</div>
                <div class="date" id="date">---</div>
            </div>
        </div>

        <!-- باکس کلاس در حال برگزاری -->
        <div class="current-class-box" id="current-class-box">
            <div class="box-title">🕒 الان باید در این کلاس باشی:</div>
            <div class="box-content" id="current-class-info">
                کلاسی در حال برگزاری نیست
            </div>
        </div>

        <!-- باکس امتحان‌های نزدیک -->
        <div class="exam-reminder-box" id="exam-reminder-box">
            <div class="box-title">📝 امتحان‌های پیش رو:</div>
            <div class="box-content" id="exam-reminder-info">
                امتحانی نزدیک نیست
            </div>
        </div>

        <!-- جدول برنامه هفتگی -->
        <div class="table-wrapper">
            <table id="weekly-schedule-table">
                <thead>
                    <tr>
                        <th>روز</th>
                        <th>زمان کلاس</th>
                        <th>نام درس</th>
                        <th>نام استاد</th>
                        <th>زمان امتحان</th>
                    </tr>
                </thead>
                <tbody id="schedule-body">
                    <!-- ردیف‌ها با جاوااسکریپت ساخته می‌شوند -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
