<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل دروس انتخابی - بخش اول</title>
    <!-- اتصال به فایل استایل -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="panel">
        <div class="panel-header">
            <div class="panel-title">📚 دروس انتخابی</div>
            <div class="clock-container">
                <div class="clock" id="clock">--:--:--</div>
                <div class="date" id="date">---</div>
            </div>
        </div>
        <div class="table-wrapper">
            <table id="courses-table">
                <thead>
                    <tr>
                        <th>ردیف</th>
                        <th>کد درس</th>
                        <th>نام درس</th>
                        <th>کد ارائه</th>
                        <th>نام استاد</th>
                        <th>زمان‌بندی ارائه</th>
                        <th>زمان‌بندی امتحان</th>
                        <th>وضعیت اعتبار</th>
                        <th>جنسیت</th>
                        <th>شهریه (ریال)</th>
                        <th>ارز</th>
                        <th>ارائه دهنده</th>
                        <th>بازه اخذ</th>
                        <th>واحد نظری</th>
                        <th>واحد عملی</th>
                        <th>نوع ارائه</th>
                        <th>وضعیت حذف</th>
                        <th>وضعیت درس دانشجو</th>
                        <th>وضعیت اخذ</th>
                        <th>وضعیت در رشته</th>
                        <th>ساعت نظری</th>
                        <th>ساعت عملی</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- ردیف‌ها با جاوااسکریپت ساخته می‌شوند -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- اتصال به فایل جاوااسکریپت -->
    <script src="script.js"></script>
</body>
</html>
