    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazir', 'Tahoma', sans-serif;
        }

        body {
            background: #f0f2f5;
            padding: 20px;
            direction: rtl;
        }

        .panel {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .panel-header {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .panel-title {
            font-size: 24px;
            font-weight: bold;
        }

        .clock-container {
            text-align: left;
            font-size: 16px;
            background: rgba(255,255,255,0.15);
            padding: 8px 16px;
            border-radius: 10px;
        }

        .clock {
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .date {
            font-size: 14px;
            opacity: 0.9;
        }

        .table-wrapper {
            overflow-x: auto;
            padding: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            min-width: 1200px;
        }

        th {
            background: #f8f9fa;
            color: #333;
            font-weight: bold;
            padding: 12px 10px;
            text-align: center;
            border-bottom: 2px solid #dee2e6;
            white-space: nowrap;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #e9ecef;
            text-align: center;
            vertical-align: middle;
        }

        tr:hover td {
            background-color: #f1f3f5;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .valid {
            background: #d4edda;
            color: #155724;
        }

        .empty-cell {
            color: #adb5bd;
            font-style: italic;
        }

        .fee {
            font-weight: bold;
            color: #2c3e50;
        }

        @media (max-width: 768px) {
            .panel-header {
                flex-direction: column;
                align-items: flex-start;
            }
            .clock-container {
                text-align: right;
                width: 100%;
            }
        }
    </style>
</head>

        // ========== نمایش جدول ==========
        function renderTable() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            courses.forEach((course, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${course.code}</td>
                    <td style="text-align: right;">${course.name}</td>
                    <td>${course.offerCode}</td>
                    <td style="text-align: right;">${course.professor}</td>
                    <td>${course.schedule}</td>
                    <td>${course.exam || '<span class="empty-cell">-</span>'}</td>
                    <td><span class="status-badge valid">${course.validity}</span></td>
                    <td>${course.gender || '<span class="empty-cell">-</span>'}</td>
                    <td class="fee">${course.fee.toLocaleString('fa-IR')}</td>
                    <td>${course.currency}</td>
                    <td>${course.provider}</td>
                    <td>${course.period}</td>
                    <td>${course.theoreticalUnits}</td>
                    <td>${course.practicalUnits}</td>
                    <td>${course.presentationType}</td>
                    <td>${course.deleteStatus}</td>
                    <td>${course.studentStatus}</td>
                    <td>${course.takeStatus}</td>
                    <td>${course.majorStatus}</td>
                    <td>${course.theoreticalHours}</td>
                    <td>${course.practicalHours}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // ========== ساعت و تاریخ ایران ==========
        function updateClock() {
            const now = new Date();
            const optionsTime = {
                timeZone: 'Asia/Tehran',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            };
            const optionsDate = {
                timeZone: 'Asia/Tehran',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                weekday: 'long'
            };
            document.getElementById('clock').textContent = now.toLocaleTimeString('fa-IR', optionsTime);
            document.getElementById('date').textContent = now.toLocaleDateString('fa-IR', optionsDate);
        }

        renderTable();
        updateClock();
        setInterval(updateClock, 1000);
